<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAREM NASGOR 🔥</title>

<meta property="og:title" content="MAREM NASGOR 🔥">
<meta property="og:description" content="Jangan klik kalau lagi kenyang 😏">
<meta property="og:image" content="https://i.ibb.co.com/4RKHQJH4/20260406-232731-0000.jpg"></a>
<meta property="og:type" content="website">

<style>
body {
  margin:0;
  font-family:sans-serif;
  color:white;
  overflow:hidden;
}

/* HERO */
.hero {
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
}

/* IMAGE + ZOOM */
.hero img {
  width:100%;
  height:100%;
  object-fit:cover;
  filter:brightness(0.5);
  animation:zoom 12s ease-in-out infinite alternate;
}

/* ZOOM EFFECT */
@keyframes zoom {
  from { transform:scale(1); }
  to { transform:scale(1.1); }
}

/* OVERLAY */
.overlay {
  position:absolute;
  inset:0;
  background:linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.2));
}

/* CONTENT */
.content {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  text-align:center;
  width:90%;
  max-width:420px;
  animation:fadeIn 1s ease;
}

h1 {
  font-size:38px;
}

.highlight {
  color:#ff7a00;
  text-shadow:0 0 25px rgba(255,122,0,0.9);
}

p {
  color:#ddd;
  margin-top:15px;
}

/* CTA */
.cta-btn {
  margin-top:30px;
  display:inline-block;
  padding:20px 40px;
  background:linear-gradient(135deg,#ff7a00,#ff2d00);
  color:white;
  font-weight:bold;
  font-size:20px;
  border-radius:20px;
  text-decoration:none;
  animation:pulse 1.5s infinite;
  box-shadow:0 0 30px rgba(255,122,0,0.6);
}

/* TAP TO SOUND */
.tap-hint {
  margin-top:10px;
  font-size:12px;
  opacity:0.6;
}

/* NOTIF */
.notif {
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.7);
  padding:10px 15px;
  border-radius:10px;
  font-size:13px;
  animation:showNotif 4s infinite;
}

/* ANIMASI */
@keyframes fadeIn {
  from{opacity:0; transform:translate(-50%, -40%)}
  to{opacity:1; transform:translate(-50%, -50%)}
}

@keyframes pulse {
  0%{transform:scale(1)}
  50%{transform:scale(1.08)}
  100%{transform:scale(1)}
}

@keyframes showNotif {
  0%{opacity:0; transform:translate(-50%,20px)}
  20%{opacity:1; transform:translate(-50%,0)}
  80%{opacity:1}
  100%{opacity:0}
}
</style>
</head>

<body onclick="playSound()">

<div class="hero">

  <!-- IMAGE -->
  <img src="https://i.ibb.co.com/4RKHQJH4/20260406-232731-0000.jpg"></a>

  <!-- OVERLAY -->
  <div class="overlay"></div>

  <!-- CONTENT -->
  <div class="content">

    <h1>
      Lagi Laper? 😈<br>
      <span class="highlight">Jangan Scroll...</span>
    </h1>
    
    <p>Nasi Goreng Marem Bikin Nagih Sekali Coba</p>

    <p>
      Yang klik ini biasanya...<br>
      langsung order 😏🔥
    </p>

    <a href="https://lp-marem.netlify.app/" class="cta-btn">
      JANGAN SCROLL
    </a>

    <div class="tap-hint">
      🔊 Tap layar... ada suara dapur 😁
    </div>
    
    <p>Masakan rumahan, bumbu nendang, diantar sampai depan pintu.</p>

  </div>
  
  <!-- NOTIF -->
  <div class="notif" id="notif">
    🔥 Baru saja dibuka warga sini
  </div>

</div>

<!-- AUDIO -->
<audio id="sound" src="https://www.myinstants.com/media/sounds/frying-pan.mp3"></audio>

<script>
// PLAY SOUND
function playSound() {
  document.getElementById("sound").play();
}

// NOTIF
let notifText = [
"🔥 Baru saja dibuka tetangga",
"🔥 Warga sebelah sudah klik",
"🔥 Hampir kehabisan hari ini",
"🔥 Banyak yang diam-diam buka 😏"
];

setInterval(()=>{
  let notif = document.getElementById("notif");
  notif.innerText = notifText[Math.floor(Math.random()*notifText.length)];
},4000);
</script>

</body>
</html>
